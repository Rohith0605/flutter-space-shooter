name: flutter_space_shooter
description: A modern, stylized space shooter game built with Flutter featuring 5+ levels, engaging gameplay, and smooth animations.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Game and animation
  flame: ^1.10.0
  flame_audio: ^2.1.0
  
  # State management
  provider: ^6.0.0
  
  # UI
  google_fonts: ^6.0.0
  
  # Other utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_linter: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/audio/sounds/
    - assets/audio/music/
  
  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700
